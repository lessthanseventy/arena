[tools]
zig = "0.17.1"

# mise's zig has a cache of its own. Another install of the same version (the system's) makes the
# same libc++ manifests from files with other stats, so each rewrites the other's, and two
# compiles write-locking them at once wait on each other for good.
[env]
ZIG_GLOBAL_CACHE_DIR = "{{env.HOME}}/.cache/zig-mise"

# A compile waiting on another's cache lock waits for good, at no CPU: each zig task ends itself
# after 20 minutes, so what fails is the task, by name. The timeout is per task and leaves out its
# depends: a hung test ends inside babylon's 30 minutes for the gate only after a build under 10.
[tasks.build]
timeout = "20m"
run = "zig build"

[tasks.test]
depends = ["build"]
timeout = "20m"
run = "zig build test --summary all"

[tasks.e2e]
description = "arena driven in a private tmux, against another"
depends = ["build"]
run = ["zsh test/e2e.zsh", "zsh test/e2e-cleanup.zsh"]

[tasks.hooks]
description = "babylon's inbox hook against a fake babylon, and the tmux guard on Bash calls, and the ask reminder"
run = [
  "zsh test/inbox-hook.zsh",
  "zsh test/tmux-guard.zsh",
  "zsh test/ask-reminder.zsh",
  "zsh test/ask-gate.zsh",
  "zsh test/session-record.zsh",
  "zsh test/handoff-nudge.zsh",
]

[tasks.plugin]
description = "the plugin's manifest and hooks"
run = "claude plugin validate ."

[tasks.install]
description = "after a landing: arena built"
timeout = "20m"
run = "zig build"

[tasks.check]
description = "the unit tests, then end to end, then the hooks and the plugin"
depends = ["test", "e2e", "hooks", "plugin"]
