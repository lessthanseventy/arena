[tools]
zig = "0.17.1"

# mise's zig has a cache of its own. Another install of the same version (the system's) makes the
# same libc++ manifests from files with other stats, so each rewrites the other's, and two
# compiles write-locking them at once wait on each other for good.
[env]
ZIG_GLOBAL_CACHE_DIR = "{{env.HOME}}/.cache/zig-mise"

# A compile waiting on another's cache lock waits for good, at no CPU: each zig task ends itself
# after 20 minutes, so what fails is the task, by name. The timeout is per task and leaves out its
# depends: a hung test ends inside babylon's 30 minutes for the gate only after a build under 10.
[tasks.build]
timeout = "20m"
run = "zig build"

[tasks.test]
depends = ["build"]
timeout = "20m"
run = "zig build test --summary all"

[tasks.e2e]
description = "arena driven in a private tmux, against another"
depends = ["build"]
run = ["zsh test/e2e.zsh", "zsh test/e2e-cleanup.zsh"]

[tasks.hooks]
description = "the tmux guard on Bash calls, and the session record"
run = ["zsh test/tmux-guard.zsh", "zsh test/session-record.zsh"]

[tasks.plugin]
description = "the plugin's manifest and hooks"
run = "claude plugin validate ."

[tasks.install]
description = "after a landing: arena built, and put outside the checkout where the arena on PATH runs it"
timeout = "20m"
# cp then mv: a rename is one change, so a running arena never execs a half-written file. The
# same bytes are left alone, so an install that changed nothing restarts no arena.
run = '''
zig build
bin="${XDG_DATA_HOME:-$HOME/.local/share}/arena/bin/arena"
cmp -s zig-out/bin/arena "$bin" && exit 0
mkdir -p "$(dirname "$bin")"
cp zig-out/bin/arena "$bin.new"
mv -f "$bin.new" "$bin"
echo "arena: installed $bin" >&2
'''

[tasks.check]
description = "the unit tests, then end to end, then the hooks and the plugin"
depends = ["test", "e2e", "hooks", "plugin"]

[tasks.dist]
description = "release tarballs and checksums for Linux and macOS, x86_64 and aarch64, in dist/"
timeout = "40m"
run = "zsh scripts/dist.zsh"
