name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: command -v zsh || sudo apt-get install -y zsh
      - run: mise run dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
